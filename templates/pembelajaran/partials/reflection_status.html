{% if success %}
<div class="p-4 rounded-2xl bg-emerald-500/10 dark:bg-emerald-950/40 border border-emerald-500/25 text-emerald-800 dark:text-emerald-200 text-xs font-medium flex items-center justify-between gap-3 animate-fadeIn">
    <div class="flex items-center gap-2.5">
        <svg class="w-5 h-5 text-emerald-600 dark:text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
        </svg>
        <span class="font-bold font-sans">{{ message }}</span>
    </div>
    {% if just_claimed %}
    <span class="px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-700 dark:text-emerald-300 font-mono font-bold text-[11px] border border-emerald-500/30">
        +{{ modul.xp_reflection }} XP
    </span>
    {% endif %}
</div>

<!-- Out-Of-Band Swap to update save status badge in real time -->
<span id="reflection-save-status" hx-swap-oob="true" class="text-[11px] font-mono px-2.5 py-1.5 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 rounded-xl border border-emerald-500/20 font-semibold">
    ✅ Refleksi Tersimpan (+15 XP)
</span>

{% else %}
<div class="p-4 rounded-2xl bg-rose-500/10 dark:bg-rose-950/40 border border-rose-500/25 text-rose-800 dark:text-rose-200 text-xs font-medium flex items-center gap-2.5">
    <svg class="w-5 h-5 text-rose-500 dark:text-rose-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
    <span>{{ message }}</span>
</div>
{% endif %}
