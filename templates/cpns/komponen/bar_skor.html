{% load cpns_tags %}
<div class="py-2">
    <div class="flex items-baseline justify-between gap-3 text-sm">
        <span class="font-mono font-semibold text-[#F3F4F6]">{{ subtes }}<span class="ml-3">{{ skor }} / {{ maks }}</span></span>
        {% if ambang %}
            {% if lulus %}
                <span class="text-right text-[#34D399]"><span aria-hidden="true">&#10003;</span> Lolos (ambang {{ ambang }})</span>
            {% else %}
                <span class="text-right text-[#F87171]"><span aria-hidden="true">&#10007;</span> Kurang {{ ambang|kurang:skor }} (ambang {{ ambang }})</span>
            {% endif %}
        {% else %}
            <span class="text-right text-[#34D399]"><span aria-hidden="true">&#10003;</span> Selesai</span>
        {% endif %}
    </div>
    <div class="relative mt-2 h-[10px] rounded-full bg-[#1C293E]" role="img" aria-label="{{ subtes }}: {{ skor }} dari {{ maks }}{% if ambang %}, ambang {{ ambang }}{% endif %}">
        <div class="h-full rounded-full {% if lulus %}bg-[#34D399]{% else %}bg-[#F87171]{% endif %}" style="width: {% widthratio skor maks 100 %}%"></div>
        {% if ambang %}
            <div class="absolute top-[-3px] bottom-[-3px] w-[2px] bg-white" style="left: {% widthratio ambang maks 100 %}%"></div>
        {% endif %}
    </div>
</div>
