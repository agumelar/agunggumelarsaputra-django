<div class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none">
    {% if messages %}
        {% for message in messages %}
        <div 
            x-data="{ show: true }" 
            x-show="show" 
            x-init="setTimeout(() => show = false, 5000)"
            x-transition:enter="transition ease-out duration-300 transform"
            x-transition:enter-start="opacity-0 translate-y-2"
            x-transition:enter-end="opacity-100 translate-y-0"
            x-transition:leave="transition ease-in duration-200 transform"
            x-transition:leave-start="opacity-100 translate-y-0"
            x-transition:leave-end="opacity-0 translate-y-2"
            class="pointer-events-auto p-4 rounded-xl border shadow-lg text-xs font-medium flex items-center justify-between gap-3
                {% if message.tags == 'error' %}
                    bg-surface-high border-danger/40 text-red-300
                {% elif message.tags == 'success' %}
                    bg-surface-high border-success/40 text-emerald-300
                {% elif message.tags == 'warning' %}
                    bg-surface-high border-warning/40 text-amber-300
                {% else %}
                    bg-surface-high border-primary/40 text-sky-300
                {% endif %}"
        >
            <div class="flex items-center gap-2">
                <span>{{ message }}</span>
            </div>
            <button @click="show = false" class="text-gray-400 hover:text-white focus:outline-none">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
        {% endfor %}
    {% endif %}
</div>
