{% if base_template == 'base.html' %}
<div class="min-h-[60vh] flex items-center justify-center py-10 px-4">
    <div class="m3-surface w-full max-w-md p-6 sm:p-8 space-y-6 rounded-3xl shadow-xl border border-outline-variant text-center">
        <h1 class="text-2xl font-extrabold text-foreground font-display tracking-tight">Keluar dari akun?</h1>
        <p class="text-sm text-gray-600 dark:text-gray-400">Kamu harus masuk lagi untuk membuka akunmu.</p>
        <form method="post" action="{% url 'accounts:logout' %}" class="flex flex-col sm:flex-row gap-3 justify-center">
            {% csrf_token %}
            <button type="submit" class="inline-flex items-center justify-center min-h-11 px-6 rounded-lg bg-red-600 hover:bg-red-700 text-white font-semibold transition-colors">Keluar</button>
            <a href="{{ url_batal }}" class="inline-flex items-center justify-center min-h-11 px-6 rounded-lg border border-outline-variant text-foreground hover:bg-surface-high transition-colors">Batal</a>
        </form>
    </div>
</div>
{% else %}
<div class="max-w-md mx-auto py-10 space-y-6 text-center">
    <h1 class="text-2xl font-bold text-[#F3F4F6]">Keluar dari akun?</h1>
    <p class="text-sm text-[#CBD5E1]">Kamu harus masuk lagi untuk membuka akunmu.</p>
    <form method="post" action="{% url 'accounts:logout' %}" class="flex flex-col sm:flex-row gap-3 justify-center">
        {% csrf_token %}
        <button type="submit" class="inline-flex items-center justify-center min-h-11 px-6 rounded-lg bg-[#38BDF8] hover:bg-[#7DD3FC] text-[#082F49] font-semibold transition-colors">Keluar</button>
        <a href="{{ url_batal }}" class="inline-flex items-center justify-center min-h-11 px-6 rounded-lg border border-white/[0.16] text-[#F3F4F6] hover:bg-white/[0.06] transition-colors">Batal</a>
    </form>
</div>
{% endif %}
