services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ags-django-app
    restart: always
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DEBUG=False
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db
    volumes:
      - .:/app
      - ags_media:/app/media
      - ags_static:/app/staticfiles
    networks:
      - ags-network

  db:
    image: postgres:17-alpine
    container_name: ags-postgres
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB wajib diisi di .env}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER wajib diisi di .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env}
    volumes:
      - ags_pgdata:/var/lib/postgresql/data
    networks:
      - ags-network

volumes:
  ags_pgdata:
    name: ags_pgdata
  ags_media:
    name: ags_media
  ags_static:
    name: ags_static

networks:
  ags-network:
    name: ags-network
    driver: bridge
